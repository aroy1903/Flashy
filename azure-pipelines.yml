# Azure DevOps pipeline — builds the Flashy (StuddyPebble) web client and
# deploys it to Azure Static Web Apps.
#
# Pipeline variables to set in Azure DevOps (Pipelines → Edit → Variables):
#   VITE_SUPABASE_URL        — your Supabase project URL (https://<ref>.supabase.co)
#   VITE_SUPABASE_ANON_KEY   — the project's anon/publishable key (mark secret)
#   AZURE_SWA_TOKEN          — Static Web App deployment token (mark secret)

trigger:
  branches:
    include:
      - main
      - laya-develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node 20

  - script: npm ci
    workingDirectory: client
    displayName: Install dependencies

  - script: npm run build
    workingDirectory: client
    displayName: Build (vite)
    env:
      VITE_SUPABASE_URL: $(VITE_SUPABASE_URL)
      VITE_SUPABASE_ANON_KEY: $(VITE_SUPABASE_ANON_KEY)

  - publish: client/dist
    artifact: webapp
    displayName: Publish build artifact

  - task: AzureStaticWebApp@0
    displayName: Deploy to Azure Static Web Apps
    inputs:
      app_location: client/dist
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(AZURE_SWA_TOKEN)
